name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  m0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.12"
          enable-cache: true

      - name: Restore locked Python environment
        run: uv sync --frozen

      - name: Build locked LibreOffice visual renderer
        run: docker build -t docfit-libreoffice-visual:25.2.3.2 docker/visual-renderer

      - name: Smoke-test real DOCX conversion
        run: |
          mkdir -p .tmp/visual-renderer-smoke
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,size=512m,mode=1777 \
            -e HOME=/tmp/home \
            -v "$PWD/evals/fixtures/smoke/school-template.docx:/input/document.docx:ro" \
            -v "$PWD/.tmp/visual-renderer-smoke:/output:rw" \
            docfit-libreoffice-visual:25.2.3.2 sh -lc \
            "mkdir -p /tmp/home /tmp/lo-profile && soffice --headless --nologo \
             --nodefault --nofirststartwizard --nolockcheck --norestore \
             -env:UserInstallation=file:///tmp/lo-profile \
             --convert-to pdf --outdir /output /input/document.docx"
          test -s .tmp/visual-renderer-smoke/document.pdf

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: Run deterministic doctor gate
        run: uv run docfit doctor
