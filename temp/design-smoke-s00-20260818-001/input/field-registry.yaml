schema_version: docfit-content-field-registry/v0.2
registry_id: docfit.thesis.content_fields
registry_version: 0.5.0
revision: 2026-08-13.1
status: accepted
scope: cross_stage_thesis_content_semantics
open_world: true
description: 在 accepted v0.4 的 54 个字段职责上，以 clean break 将正文标题语义改为章标题、一级节标题、二级节标题等清晰层级；不提供旧 field_id alias，作为新模板提取与后续内容链路的当前合同。
authority:
  design: DESIGN.md
  consumer_binding: registry_id_registry_version_sha256
  mutable_latest_allowed: false
id_policy:
  canonical_pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
  canonical_shape: <domain>.<concept>[.<role>][.<qualifier>]
  forbidden_semantics:
  - school_or_template_name
  - locator_or_page_number
  - style_name
  - instance_sequence
  - concrete_field_value
  language_qualifier_rule: 仅在语言变体是独立逻辑值时使用 zh/en qualifier；重复结构内容的语言记录在 content item。
unknown_field_policy:
  field_id: null
  classification_status: unregistered
  local_field_key_pattern: ^uf-[0-9]{4,}$
  required_metadata:
  - label
  - meaning
  - content_type
  - source_evidence
  allowed_dispositions:
  - placed
  - retain
  - exclude
  - manual
  - unresolved
  proposed_canonical_id_is_binding: false
  promotion_requires_human_review: true
language_policy:
  item_languages:
  - zh
  - en
  - mixed
  - und
  parallel_content_keys:
  - parallel_group_id
  - translation_of
  automatic_translation: forbidden_without_authorized_source
versioning:
  patch: non_semantic_label_or_note_correction
  minor: additive_field_or_alias_or_pre_1_0_consumer_semantic_contract
  incompatible_change: new_field_id_with_deprecated_and_replaced_by_or_major
  old_consumers_follow_latest: false
known_gaps:
- legacy_optional_mixes_presence_and_cardinality
- school_specific_meaning_in_body_inline_emphasis
- multi_parent_relationship_for_body_table_note_unresolved
- projection_schema_for_composite_values_pending
derived_from:
  path: docs/plans/docfit-content-field-registry/content-fields-v0.4.yaml
  sha256: 8b335cc86b60ed2f391ac696155525841b585be09affcd406042e5ad5e1c3dbb
  migration: clean_break_rename_body_heading_levels_to_unambiguous_outline_taxonomy_without_aliases
normalizations:
- source_field_id: acknowledgement
  canonical_field_id: acknowledgement.body
  reason: source identifier lacked the required domain.concept shape
- field_ids:
  - body.figure.caption
  - body.table.caption
  - appendix.title
  change: remove fixed zh language; record language and parallel grouping on each content item
review:
  status: accepted
  reviewer: 产品负责人（当前用户）
  reviewed_at: '2026-08-13'
  conclusion: accepted_for_clean_break_template_and_content_runtime
  acceptance_evidence: 用户确认章标题、一级节标题、二级节标题命名与单一可复用正文结构方案。
  pilots:
  - school-template-extraction
  - student-content-runtime
