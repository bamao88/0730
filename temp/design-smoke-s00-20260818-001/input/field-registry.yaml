- field_id: body.figure
  label: 插图
  meaning: 正文中由同一组题注共同描述的语义插图；可由一个或多个源图片资产组成。
  content_type: image
  cardinality: many
  parent_field_id: body.chapters
  notes: 一个 content item 可绑定一项或多项 asset_refs；多面板或并排图片若共享同一组题注，按一个语义图提取。仅用于承载图片的无文本表格是布局容器，不另算 body.table。
  value_sources:
  - student_source
  student_extraction_policy: optional
  composition:
    semantic_unit: captioned_figure
    asset_cardinality: one_or_more
    layout_only_image_grid_is_body_table: false
- field_id: body.figure.caption
  label: 图题
  meaning: 描述父级图或表的题注正文；源中可位于对象前后，目标位置和编号由模板决定。
  content_type: text
  cardinality: many
  parent_field_id: body.figure
  notes: 图题的位置、编号和样式由具体模板规范约束；语言保存在具体 content item 上，中英平行图题共享本字段 ID。
  value_sources:
  - student_source
  student_extraction_policy: optional
  normalization:
    preserve_observed_value: true
    normalized_value_excludes_generated_prefixes:
    - 图 <chapter>-<sequence>
    - Fig. <chapter>-<sequence>
    - Figure <chapter>-<sequence>
    trim_outer_whitespace: true
    generation_owner: target_template_caption_numbering
    source_prefix_grammar:
      type_labels:
      - 图
      - Fig.
      - Figure
      source_number: optional
      number_examples:
      - '2'
      - 2-4
      - 2－4
      - 2—4
      remove_from_normalized_value: true
  caption_binding:
    primary_evidence: source_structure_adjacency_and_layout
    source_number_role: trace_evidence_not_object_identity
    number_mismatch: retain_observed_and_require_human_confirmation
