  value_sources:
  - student_source
  student_extraction_policy: optional
  normalization:
    preserve_observed_value: true
    normalized_value_excludes_generated_prefixes:
    - 表 <chapter>-<sequence>
    - Table <chapter>-<sequence>
    apply_per_language_line: true
    trim_outer_whitespace: true
    generation_owner: target_template_caption_numbering
    source_prefix_grammar:
      type_labels:
      - 表
      - Table
      source_number: optional
      number_examples:
      - '2'
      - 2-4
      - 2－4
      - 2—4
      remove_from_normalized_value: true
  caption_binding:
    primary_evidence: source_structure_adjacency_and_layout
    source_number_role: trace_evidence_not_object_identity
    number_mismatch: retain_observed_and_require_human_confirmation
