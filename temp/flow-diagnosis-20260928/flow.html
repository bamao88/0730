:root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20302b; background: #f4f6f2; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 920px; margin: 0 auto; padding: 24px 22px 72px; }
header { padding-bottom: 18px; border-bottom: 1px solid #d9dfd8; }
h1 { font-size: 22px; letter-spacing: -.03em; margin: 0 0 6px; }
.context { font-size: 12px; color: #607068; margin: 0; }
.picker { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
label { font-size: 13px; font-weight: 650; white-space: nowrap; }
select { min-width: 0; flex: 1; padding: 10px 12px; border: 1px solid #bac8be; border-radius: 9px; background: white; color: #20302b; font: inherit; }
.flow { margin: 25px 0 0 15px; border-left: 2px solid #cbd8cf; padding-left: 24px; }
.step { position: relative; background: white; border: 1px solid #dce5dd; border-radius: 12px; padding: 16px 18px; margin: 0 0 14px; box-shadow: 0 2px 8px #243d2b08; }
.step::before { content: attr(data-number); position: absolute; left: -40px; top: 16px; width: 28px; height: 28px; border: 2px solid #cbd8cf; border-radius: 50%; background: #f4f6f2; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #607068; }
.step.warn { border-color: #deb675; background: #fffdf8; }
.step.warn::before { border-color: #d59b42; color: #8e5b12; }
.step.fail { border-color: #dc9c96; background: #fffaf9; }
.step.fail::before { border-color: #cb7068; color: #a94740; }
.step.muted { opacity: .63; }
.top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
h2 { font-size: 15px; margin: 0; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 5px; background: #e7f2e9; color: #2c7043; white-space: nowrap; }
.warn .badge { background: #f9e6c6; color: #8e5b12; }
.fail .badge { background: #f8deda; color: #a94740; }
.muted .badge { background: #e8ece8; color: #65736a; }
.content { font-size: 13px; line-height: 1.65; margin-top: 11px; overflow-wrap: anywhere; }
.content p { margin: 5px 0; }
.key { color: #65756b; display: inline-block; min-width: 78px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #eef2ed; padding: 2px 5px; border-radius: 4px; font-size: 12px; }
a { color: #285c89; text-decoration: underline; text-underline-offset: 2px; }
.tabs { display: flex; gap: 6px; margin-top: 11px; }
.tabs button { border: 1px solid #c6d2c7; border-radius: 6px; background: #f3f6f2; color: #4a6253; font: inherit; font-size: 12px; padding: 5px 9px; cursor: pointer; }
.tabs button.active { background: #285c46; border-color: #285c46; color: white; }
.branch { margin-top: 9px; border-left: 3px solid #c8d8ca; padding-left: 11px; }
@media (max-width: 600px) { main { padding: 18px 14px 50px; } .flow { margin-left: 12px; padding-left: 20px; } .step::before { left: -34px; } .picker { align-items: stretch; flex-direction: column; } }
