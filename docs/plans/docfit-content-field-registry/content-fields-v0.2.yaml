policy_schema:
  value_source_kinds:
  - student_source
  - task_input
  - system_generated
  - external_asset
  - human_confirmed
  student_extraction_policy_values:
  - required
  - optional
  - not_applicable
  required_semantics: 普通论文预期存在；源中不存在时仍输出 missing，不得猜值。
  optional_semantics: 学生源允许存在；源中不存在时输出 missing，不计作系统生成或任务输入。
  not_applicable_semantics: 不从学生源抽取；由任务输入、系统生成或显式外部资产承担。
