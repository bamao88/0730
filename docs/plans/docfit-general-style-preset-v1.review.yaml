schema_version: docfit-general-style-preset/v1.0
preset_id: docfit.general_thesis.zh
preset_version: 1.0.0
revision: 2026-08-11.2
status: product_definition_accepted
scope: complete_fallback_for_registered_thesis_fields
language_context: zh_primary_with_en_parallel_content
description: >-
  DocFit 通用学位论文兜底样式的首个产品验收版本。它覆盖内容字段注册表 v0.1 的全部
  54 个字段：50 个字段具有明确的完整样式或版面角色，4 个字段具有明确的非样式处理。
  v1 按角色类型定义完整属性集合，并可展开得到不依赖 Word 隐式默认值的最终有效值。
  产品负责人已于 2026-08-11 接受三张产品评审表和其中的产品决策。该接受不构成
  国家标准符合性声明，也不代表运行时已经实现。

artifact_readiness:
  product_review_document: docs/human/docfit-general-style-preset-v1-product-review.md
  field_registry:
    path: docs/plans/docfit-content-field-registry/content-fields-v0.1.yaml
    registry_id: docfit.thesis.content_fields
    registry_version: 0.1.0
    sha256: 9779d0272fc395245002184d43e8356b0722a6821e8ca0a36ced0db6d26d522d
  property_closure: passed_for_declared_product_property_scope
  product_definition_complete: true
  human_product_acceptance: accepted_2026_08_11
  next_stage_allowed: true
  production_runtime_readiness: out_of_scope_for_this_revision
  counts:
    registry_fields: 54
    styled_or_layout_fields: 50
    explicit_non_style_fields: 4
    unhandled_fields: 0
    style_roles: 44
    document_roles: 13
    source_records: 8
  property_closure_definition:
    - every_registry_field_has_exactly_one_handling_record
    - every_styled_field_references_existing_complete_roles
    - every_role_has_a_traceable_evidence_profile
    - every_inherited_style_resolves_without_cycles_or_missing_bases
    - every_style_role_has_a_declared_role_type
    - every_style_role_resolves_every_property_required_by_its_role_type
    - zero_values_are_explicit_zero
    - non_applicable_values_are_explicit_N_A
    - absent_numbering_and_tab_stops_are_explicit_none
    - no_resolved_value_is_blank_null_or_word_default
    - every_value_is_classified_as_national_standard_institutional_consensus_or_product_decision
  product_definition_blockers: []
  accepted_product_decisions:
    - cover_fallback_boundary_and_geometry_as_reviewed
    - duplex_binding_and_non_mirrored_margin_choice_as_reviewed
    - product_gap_fill_roles_as_reviewed
    - table_body_alignment_and_cell_padding_as_reviewed
    - five_controlled_font_parameter_boundary_as_reviewed
    - configuration_defaults_and_field_semantics_as_reviewed
  non_blocking_external_review:
    - licensed_or_authorized_final_standard_text_review_before_any_national_conformance_claim
  review_governance:
    every_fallback_style_discussion_or_change_requires_updated_product_review_tables: true
    required_human_views:
      - global_fallback_style_table
      - complete_field_handling_mapping_table
      - inheritance_expanded_effective_style_table
    yaml_alone_is_sufficient_for_product_review: false

authority_policy:
  precedence:
    - verified_school_complete_role
    - this_complete_versioned_preset_role
  selection_granularity: complete_semantic_role
  property_level_school_preset_mixing: forbidden
  word_normal_counts_as_school_role_coverage: false
  model_generated_or_inferred_values_at_runtime: forbidden
  school_template_observations_as_general_preset_values: forbidden
  materialize_complete_template_before_student_fill: true
  global_container_rule: copy_school_word_template_and_preserve_it_as_final_document_container
  global_role_rule: preserve_verified_complete_school_global_roles_otherwise_use_complete_preset_global_roles
  conformance_claim: forbidden_until_authorized_final_standard_text_is_reviewed
  interpretation: >-
    高校官方指南只作为形成通用产品预设的权威参考，不被标注为国家标准；精确数值即使得到
    多校官方材料一致支持，仍属于 DocFit 预设值。学校已提供的完整角色永远覆盖本预设角色。

