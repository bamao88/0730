engineering_entry_gate:
  before_template_fusion:
    - product_definition_gate_is_complete
    - all_field_role_reference_validation_passes
    - all_style_inheritance_and_effective_property_validation_passes
    - all_source_and_evidence_profile_reference_validation_passes
    - human_accepts_explicit_product_gap_fill_roles
  current_result: allowed_to_start_implementation
  conformance_claim_gate: authorized_final_standard_text_differences_are_resolved
