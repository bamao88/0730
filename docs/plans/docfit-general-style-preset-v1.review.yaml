document_roles:
  layout.document.body_page:
    role_type: page_layout
    complete: true
    evidence_profile: official_page_consensus_product_resolution
    value_authority: docfit_product_preset_value
    page_size: A4
    width_mm: 210
    height_mm: 297
    orientation: portrait
    print_sides: duplex
    mirrored_margins: false
    binding_edge: left
    margins_mm: {top: 30, bottom: 30, left: 30, right: 30}
    gutter_mm: 0
    header_distance_mm: 22
    footer_distance_mm: 22
    header: layout.document.header
    footer: layout.document.footer
    page_number: layout.document.pagination
    rationale: >-
      30mm 四边距采用清华官方值，并满足公开稿所示最低边距；统一四边距比综合多校不同数值更稳定。
  layout.document.cover_page.zh:
    role_type: page_layout
    complete: true
    evidence_profile: official_cover_consensus
    value_authority: institutional_reference_adopted_as_product_value
    page_size: A4
    width_mm: 210
    height_mm: 297
    orientation: portrait
    print_sides: single_sided
    mirrored_margins: false
    binding_edge: left
    margins_mm: {top: 60, bottom: 60, left: 40, right: 40}
    gutter_mm: 0
    header_distance_mm: N/A
    footer_distance_mm: N/A
    header: none
    footer: none
    page_number: none
  layout.document.pagination:
    role_type: pagination
    complete: true
    evidence_profile: official_page_consensus_product_resolution
    value_authority: docfit_product_preset_value
    front_matter:
      starts_at: abstract.zh
      ends_before: body.chapters
      format: upper_roman
      restart_at: 1
    body_and_back_matter:
      starts_at: body.chapters
      ends_at: document_end
      format: arabic
      restart_at: 1
    placement: footer_center
    show_on_first_page_of_section: true
  layout.document.header:
    role_type: header_layout
    complete: true
    evidence_profile: official_page_consensus_product_resolution
    value_authority: institutional_reference_adopted_as_product_value
    starts_at: abstract.zh
    ends_at: document_end
    first_page: same_as_other_pages
    odd_page_content: current_major_part_or_chapter_title
    even_page_content: current_major_part_or_chapter_title
    separator_line: none
    style_role: style.header
  layout.document.footer:
    role_type: footer_layout
    complete: true
    evidence_profile: official_page_consensus_product_resolution
    value_authority: institutional_reference_adopted_as_product_value
    starts_at: abstract.zh
    ends_at: document_end
    first_page_content: page_number
    odd_page_content: page_number
    even_page_content: page_number
    separator_line: none
    style_role: style.footer
  layout.major_part.start:
    role_type: section_start
    complete: true
    evidence_profile: official_core_typography_consensus
    value_authority: institutional_consensus_adopted_as_product_value
    break_type: next_page
    start_side: any
    page_number_restart: none
    link_header_footer_to_previous: true
    applies_to:
      - abstract.zh
      - abstract.en
      - generated.toc
      - generated.list_of_figures
      - generated.list_of_tables
      - references.entries
      - achievements.journal_articles
      - achievements.conference_papers
      - achievements.projects
      - achievements.intellectual_property
      - achievements.entries
      - acknowledgement.body
      - appendix.body
  layout.chapter.start:
    role_type: section_start
    complete: true
    evidence_profile: national_structure_provisional
    value_authority: provisional_national_rule_reinforced_by_institutional_consensus
    break_type: next_page
    start_side: any
    page_number_restart: none
    link_header_footer_to_previous: true
    applies_to: [body.heading.level1]
    draft_clause: 5.3.1
  layout.figure:
    role_type: figure_layout
    complete: true
    evidence_profile: official_object_and_note_consensus
    value_authority: institutional_consensus_plus_docfit_size_policy
    object_alignment: center
    text_wrapping: inline
    max_width_mm: 150
    max_height_mm: 220
    allow_upscale: false
    oversize_action: scale_down_proportionally
    caption_placement: below_object
    keep_object_and_caption_together: true
    numbering_scope: chapter
    numbering_format: chapter.sequence
    subfigure_format: lowercase_letter_in_parentheses
  layout.table:
    role_type: table_layout
    complete: true
    evidence_profile: official_object_and_note_consensus
    value_authority: institutional_consensus_plus_docfit_table_policy
    object_alignment: center
    max_width_mm: 150
    width_policy: fit_within_text_area
    caption_placement: above_object
    repeat_header_row: true
    allow_row_break_across_pages: false
    continuation_caption_prefix: 续
    border_model: three_line_table
    border_width_pt: {top: 1.5, header_bottom: 1.0, bottom: 1.5, internal_horizontal: 0, internal_vertical: 0}
    default_body_alignment: center
    numbering_scope: chapter
    numbering_format: chapter.sequence
  layout.equation:
