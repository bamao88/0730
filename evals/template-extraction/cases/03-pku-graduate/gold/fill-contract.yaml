  selected_accuracy_source: temp/manual-gold-preparation/candidates/03-pku-graduate/fill-contract-r02/template-spec.yaml
  selected_template_sha256: 2328d529eef8eedc110783c106d8a9dbcf54eb230f5105c4e7d3fb88c64992d8
  registry_migration: v0.5_clean_break_field_ids
locator_contract:
  snapshot_binding: template_sha256
  preferred_locator_order:
  - content_control_tag
  - bookmark
  - placeholder_anchor
  current_template_locator_mode: placeholder_anchor
  search_scope: word/document.xml visible body flow excluding field-result cache
  uniqueness_rule: 自动槽位必须在绑定的 DOCX 快照内唯一命中。页码、像素坐标、段落序号和 paraId 均不得单独作为定位依据；正文连续内容使用唯一边界锚点定义 region。
  stale_policy: reject_on_template_hash_mismatch
  mutation_policy: validate_all_locators_before_atomic_fill_or_reinspect_after_each_commit
