  source_authority: community_maintained_school_template
  authority_note: 源文件含社区维护说明、个人邮箱、GitHub 与 changelog，不能整体视为北京大学官方规范。 本契约以源文件固定结构和 OOXML 为强证据，以明确标注来源的说明文字和脚注恢复条件要素； Gold 数据仅作校对证据，不作为未经复核的真值。
