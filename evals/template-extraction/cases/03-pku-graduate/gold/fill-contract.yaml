logical_pages:
- order: 1
  page_id: cover
  section_id: section_001
  title: 封面
  status: required
  owner: target_school_template
  source_policy: fixed_shell_plus_metadata_slots
  empty_policy: placeholder_review
  target_refs:
  - slot.cover.title_zh
  - slot.cover.author_name_zh
  - slot.cover.student_id
  - slot.cover.department
  - slot.cover.major
  - slot.cover.research_direction
  - slot.cover.advisor_name_zh
  - slot.cover.degree_type
  - slot.cover.submission_date
  page_start: document_start
- order: 2
  page_id: reviewers
  section_id: section_002
  title: 实名评审专家名单
  status: conditional
  owner: target_school_template
  source_policy: fill_from_reviewer_list_when_real_name
  empty_policy: placeholder_review
  target_refs:
  - slot.reviewers.list
  condition:
    field_id: review.mode
    equals: real_name
  absent_policy: anonymous 模式删除本节可见内容和整个条件分节；下一版权声明节的 oddPage 必须归一化为 nextPage，使版权声明直接成为封面后的第 2 个物理页，不得生成虚拟空白补页。
  page_start: next_page_after_cover
- order: 3
  page_id: copyright
  section_id: section_003
  title: 版权声明
  status: required_external_formal_submission
  owner: target_school_template
  source_policy: external_portal_qr_page
  empty_policy: placeholder_review
  target_refs:
  - region.copyright.qr_replacement
  page_start: odd_page
  missing_policy: NEEDS_INPUT
- order: 4
  page_id: abstract_cn
  section_id: section_004
  title: 中文摘要
  status: required
  owner: target_school_template
  source_policy: fill_student_content
  empty_policy: placeholder_review
  target_refs:
  - slot.abstract.zh
  - slot.keywords.zh
  page_start: odd_physical_page_via_upper_roman_restart_contract
  page_numbering:
    format: upperRoman
    start: 1
- order: 5
  page_id: abstract_en
  section_id: section_005
  title: 英文摘要
  status: required
  owner: target_school_template
  source_policy: fill_student_content
  empty_policy: placeholder_review
  target_refs:
  - slot.title.en
  - slot.author_name.en
  - slot.advisor_name.en
  - slot.abstract.en
  - slot.keywords.en
  page_start: next_page
  page_numbering:
    format: upperRoman
    continue: true
- order: 6
  page_id: toc
  section_id: section_006
  title: 目录
  status: required_generated
  owner: target_school_template
  source_policy: update_existing_outer_word_field
  empty_policy: blocking_error
  target_refs:
  - renderer.toc
  page_start: next_page
  page_numbering:
    format: upperRoman
    continue: true
- order: 7
  page_id: list_of_figures
  section_id: section_007
  title: 图目录
  status: conditional_generated
  owner: target_school_template
  source_policy: update_existing_outer_word_field
  empty_policy: remove_block
  target_refs:
  - renderer.list_of_figures
  condition: document_has_figures
  page_start: next_page
- order: 8
  page_id: list_of_tables
  section_id: section_008
  title: 表目录
  status: conditional_generated
  owner: target_school_template
  source_policy: update_existing_outer_word_field
  empty_policy: remove_block
  target_refs:
  - renderer.list_of_tables
  condition: document_has_tables
  page_start: next_page
- order: 9
  page_id: body
  section_id: section_009
  title: 正文
  status: required_repeatable
  owner: source_student_content
  source_policy: replace_single_example_with_all_structured_chapters
  empty_policy: blocking_error
  target_refs:
  - region.body.portrait_chapters
  page_start: odd_page
  page_numbering:
    format: decimal
    start: 1
- order: 10
  page_id: body_landscape
  section_id: section_010
  title: 横向宽表或大图
  status: optional
  owner: source_student_content
  source_policy: fill_only_when_landscape_content_exists
  empty_policy: remove_block
  target_refs:
  - region.body.landscape
  page_start: next_page
  page_geometry: A4_landscape
- order: 11
  page_id: references
  section_id: section_011
  title: 参考文献
  status: required
  owner: source_student_content
  source_policy: fill_entries_using_one_selected_bibliography_system
  empty_policy: placeholder_review
  target_refs:
  - region.references.entries
  page_start: next_page
- order: 12
  page_id: achievements
  section_id: section_012
  title: 博士期间工作成果
  status: conditional
  owner: source_student_content
  source_policy: fill_matching_categories
  empty_policy: placeholder_review
  target_refs:
  - slot.achievements.journal_articles
  - slot.achievements.conference_papers
  - slot.achievements.projects
  - slot.achievements.intellectual_property
  page_start: next_page
- order: 13
  page_id: acknowledgement
  section_id: section_013
  title: 致谢
  status: required
  owner: source_student_content
  source_policy: fill_if_present
  empty_policy: blocking_review
  target_refs:
  - slot.acknowledgement
  page_start: next_page
- order: 14
  page_id: declarations
  section_id: section_014
  title: 原创性声明和使用授权说明
  status: required_external_formal_submission
  owner: target_school_template
  source_policy: external_portal_qr_page
  empty_policy: placeholder_review
  target_refs:
  - region.declarations.qr_replacement
  page_start: next_page
  missing_policy: NEEDS_INPUT
review:
  status: machine_checked_pending_human_signoff
  reviewer: null
  reviewed_at: null
  conclusion: pending
  blockers:
  - 精确 Word 与填写契约文件对尚待产品负责人最终确认。
  prepared_by: Codex
validation:
  machine_checks:
  - template_sha256_matches_contract
  - every_slot_locator_matches_exactly_once_in_bound_snapshot
  - every_region_boundary_matches_exactly_once_in_bound_snapshot
  - every_slot_field_id_exists_in_content_fields
  - every_region_field_id_exists_in_content_fields
  - every_referenced_style_id_exists_in_this_contract
  - required_slots_have_non_placeholder_content
  - review_mode_is_real_name_or_anonymous
  - degree_type_has_exactly_one_checked_option
  - references_style_system_is_numeric_or_author_year_and_not_mixed
  - body_contains_at_least_one_heading_1_and_no_template_example_placeholder
  - headings_1_to_3_feed_main_toc_while_headings_4_to_5_do_not
  - figure_caption_is_below_figure
  - table_caption_is_above_table
  - every_body_figure_paragraph_uses_PKU3_and_center_alignment
  - every_substantive_table_uses_PKUf5_without_direct_grid_border_overrides
  - no_removable_layout_only_empty_paragraph_between_caption_and_page_break_before_chapter
  - equation_layout_preserves_center_formula_and_right_number
  - landscape_section_is_present_only_when_landscape_content_exists
  - anonymous_mode_removes_reviewer_section_and_normalizes_copyright_to_next_page
  - front_page_numbers_are_upper_roman_and_body_restarts_at_decimal_1
  - header_contract_uses_front_body_and_post_body_styleref_modes
  - no_undefined_bookmark_or_reference_source_error
  - no_revision_comment_external_relationship_or_old_tutorial_residue
  visual_checks:
    renderer: microsoft_word
    coverage: all_final_pages
    high_risk_pages:
    - cover
    - reviewers_or_anonymous_direct_copyright
    - copyright
    - first_front_matter_page
    - toc
    - first_body_page
    - landscape_page_if_present
    - references
    - declarations
    assertions:
    - no_unexpected_blank_content_page
    - no_overflow_or_clipped_fixed_form
    - retained_page_owners_start_on_declared_page_kind
    - all_headers_and_page_numbers_match_section_role
  gold_preparation:
    registry_version: 0.5.0
    officecli:
      passed: true
      detail: 'Validation passed: no errors found.'
    template_contract_hash_binding: passed
    human_acceptance: pending_exact_file_pair_review
