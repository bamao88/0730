schema_version: docfit-student-content-extraction-case-inventory/v1
status: restricted_local_inventory_restored_with_live_quality_gaps
module: user-content-extraction
privacy:
  contains_student_text: false
  public_ci_allowed: false
  reason: Real student source DOCX, Gold packages, review images and product review notes stay in restricted local storage.
default_commands:
  list_cases: uv run docfit student-content-e2e --list-cases
  validate_inputs: uv run docfit student-content-e2e --case <case-id> --validate-inputs-only
  e2e_extract_only: uv run docfit student-content-e2e --case <case-id> --output <actual> --eval off
  e2e_with_eval: uv run docfit student-content-e2e --case <case-id> --output <actual> --eval on
  extract: uv run docfit extract-student-content --input <source> --field-registry <registry> --output <actual>
  eval: uv run docfit eval-student-content --actual <actual> --gold <gold> --output <actual>/eval --json
gate_semantics:
  required: Failure blocks this module in restricted regression.
  trend_only: Recorded for drift and closure work, but does not block public CI until live quality closure is accepted.
