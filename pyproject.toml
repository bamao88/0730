[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "docfit-agent"
version = "0.1.0"
description = "A permission-bounded Claude Agent SDK foundation for DocFit."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "DocFit contributors" }]
dependencies = [
  "claude-agent-sdk==0.2.128",
]

[project.scripts]
docfit = "docfit.app.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires local credentials and invokes the live Claude Agent SDK",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["docfit"]
